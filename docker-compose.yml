version: '3.8'

services:
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_app
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - app-network
    restart: always

  reverse-proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-app
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge